[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-grpo-reasoning"
version = "1.1.0"
description = "Reproducibility utilities for uncertainty-weighted GRPO research"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sham Thakare" }]
keywords = ["reinforcement-learning", "grpo", "reasoning", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "torch>=2.0,<3",
]

[project.optional-dependencies]
research = [
    "accelerate>=0.30,<2",
    "datasets>=2.19,<5",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "transformers>=4.40,<6",
]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
ear-grpo-evaluate = "ear_grpo_reasoning.evaluate:main"
ear-grpo-smoke-train = "ear_grpo_reasoning.smoke_train:main"

[project.urls]
Repository = "https://github.com/shamddd/ear_grpo_reasoning"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ear_grpo_reasoning*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "experiments",
    "paper",
    "research",
    "results",
    "src/data",
    "src/models",
    "src/rl",
    "src/utils",
    "submission",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
packages = ["ear_grpo_reasoning"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["datasets", "transformers"]
ignore_missing_imports = true

[tool.setuptools.package-data]
ear_grpo_reasoning = ["py.typed"]
