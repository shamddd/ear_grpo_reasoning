name: Research Artifact CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy -p ear_grpo_reasoning

      - name: Test
        run: pytest -q

      - name: Import and deterministic smoke checks
        run: |
          python -c "import ear_grpo_reasoning"
          python -m ear_grpo_reasoning.smoke_train --config configs/smoke.yaml
          python -m ear_grpo_reasoning.smoke_train --config configs/ear_smoke.yaml
          python -m ear_grpo_reasoning.evaluate --config configs/evaluation.yaml
